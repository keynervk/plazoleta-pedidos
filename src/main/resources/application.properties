spring.application.name=pedidos
server.port=8083

spring.datasource.url=jdbc:postgresql://localhost:5432/pedidos_db
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=true

app.usuarios.url=http://localhost:8081
app.plazoleta.url=http://localhost:8082
app.jwt.secret=${JWT_SECRET:una-clave-secreta-muy-larga-para-firmar-tokens-cambiala-en-produccion-1234567890}
